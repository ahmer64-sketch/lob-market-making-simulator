name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - run: pytest -q

  reproduce:
    # Every report and figure: simulation phases plus the real-data replay (downloads ~400 MB of
    # free Tardis.dev data and checks its SHA-256 before use).
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: make all
      - uses: actions/upload-artifact@v4
        with:
          name: reports-and-figures
          path: |
            reports/
            figures/
